[workspace]
resolver = "3"
members = ["crates/domain", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

# Versions figées sur la table Stack de la spine d'architecture.
[workspace.dependencies]
domain = { path = "crates/domain" }
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
sqlx = { version = "=0.9.0", default-features = false }
rust-embed = { version = "=8.13.0", features = ["mime-guess", "include-exclude", "debug-embed"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.2.0", default-features = false, features = ["std", "serde", "parse"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
# Sans la feature `jitter` (AD-7) : l'attente annoncée vient de `http::limits`, sans aléa.
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
rand = "=0.10.3"
data-encoding = "=2.11.1"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
