# Serveurs d'Aion 2, et libellés des deux factions.
#
# En tête, [factions.elyos] et [factions.asmodian] : le libellé de chaque faction, sous la forme
# label = { en = "…", fr = "…" }. Ces deux clés sont fixes ; aucune autre faction n'est acceptée.
#
# Puis une entrée par bloc [[server]] :
#   id      slug anglais [a-z0-9_-], 32 caractères au plus ; jamais renommé, unique dans le fichier
#   region  id d'une région de `regions.toml`
#   faction "elyos" ou "asmodian" (un serveur n'accueille qu'une faction)
#   tag     le [SRV] exactement tel que le client l'affiche après le pseudo, sans les crochets :
#           non vide, 16 caractères au plus, unique dans sa région
#   label   { en = "…", fr = "…" } : `en` obligatoire, `fr` facultatif (repli sur `en`)
#   enabled facultatif, `true` par défaut ; retrait par `enabled = false`, jamais par suppression
#
# Contenu initial : les 9 paires d'accès anticipé d'Europe ; `tag` = nom du serveur en attendant le
# relevé dans le client. Vérifier avant de pousser :
# `cargo run -q -p server -- validate-reference reference`. Tout champ inconnu est refusé.

[factions.elyos]
label = { en = "Elyos", fr = "Élyséens" }

[factions.asmodian]
label = { en = "Asmodians", fr = "Asmodiens" }

[[server]]
id = "siel"
region = "europe"
faction = "elyos"
tag = "Siel"
label = { en = "Siel" }

