# Fixture : read_only seulement dans un volume.
services:
  server:
    image: fixture:local
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app
    volumes:
      - type: volume
        source: data
        target: /data
        read_only: true
networks:
  app:
    driver: bridge
volumes:
  data:
