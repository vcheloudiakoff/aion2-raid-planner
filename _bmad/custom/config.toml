# Overrides d'équipe pour _bmad/config.toml. Committé : s'applique à tout clone.
# Jamais touché par l'installeur ; fusionné en profondeur par-dessus la config de base.
#
# Pourquoi : l'install headless du 2026-11-05 (bmad-method 6.12.4, --yes) a laissé
# _bmad/config.toml sur user_name = "BMad" et communication_language = "English" ;
# seul _bmad/config.user.toml (personnel, non versionné) a reçu les réponses. On épingle
# ici pour que toute réinstallation ou tout clone parle français à Vincent.

[core]
project_name = "aion2-raid-planner"
user_name = "Vincent"
communication_language = "French"
document_output_language = "French"
output_folder = "_bmad-output"

[modules.bmm]
planning_artifacts       = "{project-root}/_bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/_bmad-output/implementation-artifacts"
project_knowledge        = "{project-root}/docs"
